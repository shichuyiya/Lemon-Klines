name: Validate snapshot pipeline
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']
  pull_request:
    paths: ['scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile collection and repair scripts
        run: python3 -m compileall -q scripts
      - name: Test price bases, history recovery, budgets and publication failures
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
