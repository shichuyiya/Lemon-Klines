name: K-line snapshot

on:
  workflow_dispatch:
    inputs:
      all_a_shares:
        description: '拉取全体 A 股日线/周线（首次初始化请勾选）'
        required: false
        default: true
        type: boolean
      all_m30:
        description: '按批次拉取全体 A 股 30 分钟线（手动运行）'
        required: false
        default: false
        type: boolean
      batch_index:
        description: '30 分钟批次编号，从 0 开始'
        required: false
        default: '0'
        type: string
      batch_size:
        description: '每批股票数，建议 50-100'
        required: false
        default: '100'
        type: string
  schedule:
    # 工作日北京时间 17:30（UTC 09:30）
    - cron: '30 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: kline-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_REPO: ${{ github.repository }}
        run: |
          if [ "${{ inputs.all_m30 }}" = "true" ]; then
            python3 scripts/kline_snapshot.py --all-a-shares --all-m30 \
              --batch-index "${{ inputs.batch_index }}" --batch-size "${{ inputs.batch_size }}" \
              --skip-daily-weekly --workers 4 --delay 0.35 --keep 7
          else
            # 全市场日K + m30 自愈补缺（缺哪个补哪个 + 每天按最旧优先刷新 200 只）。
            # day 与 m30 任务交错排队，死线守卫放弃的缺口下一轮自动补齐——
            # 快照本身就是进度，无需游标/cache 跨运行透传。
            # 腾讯源 2 worker × 0.8s 间隔，命中限流时全局冷却 30s 再战。
            python3 scripts/kline_snapshot.py --all-a-shares \
              --workers 2 --delay 0.8 --m30-refresh 200 --keep 7
          fi
