name: K-line snapshot

on:
  workflow_dispatch:
    inputs:
      all_a_shares:
        description: '拉取全体 A 股日线/周线（首次初始化请勾选）'
        required: false
        default: true
        type: boolean
      all_m30:
        description: '按批次拉取全体 A 股 30 分钟线（手动运行）'
        required: false
        default: false
        type: boolean
      batch_index:
        description: '30 分钟批次编号，从 0 开始'
        required: false
        default: '0'
        type: string
      batch_size:
        description: '每批股票数，建议 50-100'
        required: false
        default: '100'
        type: string
      backfill_days:
        description: '日线历史回填只数（向上市首日翻页，0=不回填）'
        required: false
        default: '150'
        type: string
  schedule:
    # 拆班跑：一天 4 班（北京时间 01:30 / 07:30 / 13:30 / 17:30 工作日），
    # 每班 --max-hours 4 到点收尾必发布快照，班与班靠快照续接（快照即进度）。
    # 不再单班跑满 6h——GitHub 6h 硬超时强杀会让整班数据全部丢失（实测连丢 3 班）。
    - cron: '30 17 * * 0'    # 北京周一 01:30（UTC 周日）
    - cron: '30 23 * * 0'    # 北京周一 07:30
    - cron: '30 5 * * 1-5'   # 北京 13:30
    - cron: '30 9 * * 1-5'   # 北京 17:30

permissions:
  contents: write

concurrency:
  group: kline-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 4h 死线 + 下载/解析/发布余量；显式低于 GitHub 6h 硬超时
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Restore completed progress from prior runs
        uses: actions/cache/restore@v4
        with:
          path: .kline-cache
          key: kline-progress-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kline-progress-
      - name: Test adjustment validation
        run: python3 -m unittest discover -s scripts -p 'test_adjustment.py'
      - name: Build and publish snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_REPO: ${{ github.repository }}
        run: |
          if [ "${{ inputs.all_m30 }}" = "true" ]; then
            python3 scripts/kline_snapshot.py --all-a-shares --all-m30 \
              --batch-index "${{ inputs.batch_index }}" --batch-size "${{ inputs.batch_size }}" \
              --skip-daily-weekly --workers 2 --delay 0.8 --keep 7
          else
            # 全市场日K + m30 自愈补缺（缺哪个补哪个 + 每天按最旧优先刷新 200 只）。
            # 近期日线优先供筛选；周月线聚合，历史仅在基准一致时拼接。
            # 缺口和隔离历史由后续班次续修，禁止单锚点灌入原始历史。
            # --max-hours 4：从进程启动算，到点放弃剩余任务并照常发布。
            python3 scripts/kline_snapshot.py --all-a-shares \
              --backfill-days "${{ inputs.backfill_days || '150' }}" \
              --workers 2 --delay 0.8 --m30-refresh 200 --keep 7 --max-hours 4
          fi

      - name: Keep freshness and history coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-quality-${{ github.run_id }}
          path: snapshot-quality.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save completed progress even if publication fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .kline-cache
          key: kline-progress-${{ github.run_id }}-${{ github.run_attempt }}
