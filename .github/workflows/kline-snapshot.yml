name: K-line snapshot

on:
  workflow_dispatch:
    inputs:
      all_a_shares:
        description: '拉取全体 A 股日线/周线（首次初始化请勾选）'
        required: false
        default: true
        type: boolean
      all_m30:
        description: '按批次拉取全体 A 股 30 分钟线（手动运行）'
        required: false
        default: false
        type: boolean
      batch_index:
        description: '30 分钟批次编号，从 0 开始'
        required: false
        default: '0'
        type: string
      batch_size:
        description: '每批股票数，建议 50-100'
        required: false
        default: '100'
        type: string
      backfill_days:
        description: '日线历史回填只数（向上市首日翻页，0=不回填）'
        required: false
        default: '0'
        type: string
  schedule:
    # 工作日北京时间 17:30（UTC 09:30）
    - cron: '30 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: kline-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_REPO: ${{ github.repository }}
        run: |
          if [ "${{ inputs.all_m30 }}" = "true" ]; then
            python3 scripts/kline_snapshot.py --all-a-shares --all-m30 \
              --batch-index "${{ inputs.batch_index }}" --batch-size "${{ inputs.batch_size }}" \
              --skip-daily-weekly --workers 2 --delay 0.8 --keep 7
          else
            # 全市场日K + m30 自愈补缺（缺哪个补哪个 + 每天按最旧优先刷新 200 只）
            # + 日线历史回填 150 只（向上市首日翻页，约 10 个交易日滚完全市场）。
            # day/m30/backfill 三队列交错；day/week/month/m30 全部增量合并——
            # 历史只增不减；死线放弃的缺口下一轮自动补齐。
            # 定时触发时 inputs 为空 → 回填默认 150 只/天（约 10 个交易日滚完全市场）
            python3 scripts/kline_snapshot.py --all-a-shares \
              --backfill-days "${{ inputs.backfill_days || '150' }}" \
              --workers 2 --delay 0.8 --m30-refresh 200 --keep 7
          fi
