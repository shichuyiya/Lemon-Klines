name: Repair price adjustment
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kline-snapshot
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Restore completed progress from prior runs
        uses: actions/cache/restore@v4
        with:
          path: .kline-cache
          key: kline-progress-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kline-progress-
      - name: Test adjustment validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Restore and preserve original snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p original
          gh release download kline-snapshot --repo "$GITHUB_REPOSITORY" --pattern 'kline-snapshot-*.ksnap' --dir original
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import kline_snapshot as s
          latest=max(Path('original').glob('*.ksnap'),key=lambda p:p.name)
          print('Restoring',latest)
          s.unpack_snapshot(latest.read_bytes())
          PY
      - name: Rebuild and validate every equity and ETF history
        run: |
          python3 scripts/repair_adjustment.py --cache .kline-cache --backup .adjustment-backup --workers 4 --max-seconds 5400 --report repair-report.json
      - name: Summarize repair
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('repair-report.json')
          if p.exists():
              rows=json.loads(p.read_text());errors=[r for r in rows if 'error' in r]
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write(f"Processed {len(rows)} symbols; failed {len(errors)}. See adjustment-audit artifact for full evidence.\n")
          PY
      - name: Classify remaining histories without blocking fresh data
        run: |
          python3 - <<'PY'
          import gzip,json,re
          from pathlib import Path
          failures=[]
          for p in Path('.kline-cache').glob('*.json.gz'):
              if not re.match(r'^(sh|sz|bj)\d{6}\.',p.name): continue
              d=json.loads(gzip.decompress(p.read_bytes()));a=d.get('adjustment',{})
              if a.get('schema')!=2 or a.get('mode')!='qfq' or a.get('status')=='quarantined':
                  failures.append(p.name)
                  d['adjustment']={'schema':2,'source':'legacy','mode':'unknown','status':'quarantined'}
                  d['updatedAt']=0
                  p.write_bytes(gzip.compress(json.dumps(d,separators=(',',':')).encode()))
          Path('unverified-files.json').write_text(json.dumps(failures,indent=2))
          print(f'{len(failures)} histories isolated; verified updates will still publish')
          PY
      - name: Pack repaired snapshot
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'scripts')
          import kline_snapshot as s
          print(s.pack_snapshot(Path('kline-snapshot-'+datetime.now(timezone.utc).strftime('%Y%m%d')+'.ksnap')))
          PY
      - name: Publish repaired snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload kline-snapshot kline-snapshot-*.ksnap --repo "$GITHUB_REPOSITORY" --clobber
      - name: Keep audit and recoverable source data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adjustment-audit-${{ github.run_id }}
          path: |
            repair-report.json
            unverified-files.json
            snapshot-quality.json
            original/*.ksnap
          retention-days: 30

      - name: Save completed progress even if publication fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .kline-cache
          key: kline-progress-${{ github.run_id }}-${{ github.run_attempt }}
